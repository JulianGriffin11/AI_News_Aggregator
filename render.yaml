# --------------------------------------------------------
# 1. THE STORAGE LAYER: DEFINED AT THE ROOT LEVEL
# --------------------------------------------------------
databases:
  - name: ai-news-postgres-db
    plan: free

# --------------------------------------------------------
# 2. THE COMPUTATION LAYER: DEFINED UNDER SERVICES
# --------------------------------------------------------
services:
  - type: cron
    name: ai-news-daily-runner
    plan: free
    runtime: python
    schedule: "0 8 * * *" # Triggers automatically every morning at 8:00 AM UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 main.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-news-postgres-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: MY_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false